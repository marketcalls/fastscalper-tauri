# Weekly dependency updates. Minor and patch updates arrive as one grouped
# pull request per ecosystem; major updates get their own pull request so
# breaking changes are reviewed one at a time.
#
# Not covered: the Rust toolchain in rust-toolchain.toml and the Node version
# in .nvmrc. Bump those by hand.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Workflows, plus the local composite action under .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
